
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="calculator">
        <header class="calculator-header">
            <h1>Calculator</h1>
            <p>Simple. Fast. Accurate.</p>
        </header>

        <section class="display" aria-live="polite">
            <div id="previousDisplay" class="previous-display"></div>
            <div id="currentDisplay" class="current-display">0</div>
        </section>

        <section class="buttons">
            <button class="utility" data-action="clear">C</button>
            <button class="utility" data-action="delete">DEL</button>
            <button class="operator" data-operator="/">÷</button>
            <button class="operator" data-operator="*">×</button>

            <button data-number="7">7</button>
            <button data-number="8">8</button>
            <button data-number="9">9</button>
            <button class="operator" data-operator="-">−</button>

            <button data-number="4">4</button>
            <button data-number="5">5</button>
            <button data-number="6">6</button>
            <button class="operator" data-operator="+">+</button>

            <button data-number="1">1</button>
            <button data-number="2">2</button>
            <button data-number="3">3</button>
            <button class="equals" data-action="equals">=</button>

            <button class="zero" data-number="0">0</button>
            <button data-number=".">.</button>
        </section>

        <footer>Built with HTML, CSS &amp; JavaScript</footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
